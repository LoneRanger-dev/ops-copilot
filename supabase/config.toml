# Supabase local development configuration (MASTER_BUILD_SPEC.md §23.2).
#
# This project runs authentication in demo mode (src/lib/auth/demo.ts) until a
# real Supabase project is configured, per the hackathon portability override
# (docs/IMPLEMENTATION_OVERRIDE.md) — Docker is not used, so `supabase start`
# is not part of the local workflow. This file documents the target
# configuration for a real project (local or hosted) and is consumed by the
# Supabase CLI once one is provisioned.

project_id = "ops-copilot"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/callback"]
jwt_expiry = 3600
refresh_token_rotation_enabled = true
enable_signup = true
minimum_password_length = 12

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Azure AD OIDC — configurable per environment (assumption A-10). Disabled by
# default; enable and populate secrets via `supabase secrets set` for a real
# project, never by committing values here.
[auth.external.azure]
enabled = false
client_id = "env(AZURE_AD_CLIENT_ID)"
secret = "env(AZURE_AD_CLIENT_SECRET)"
url = "env(AZURE_AD_TENANT_ID)"
redirect_uri = "http://localhost:3000/callback"
